spring.application.name=subtrack-server
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/subtrack}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT values are supplied through environment variables; never commit secrets.
subtrack.jwt.issuer=${JWT_ISSUER:subtrack}
subtrack.jwt.audience=${JWT_AUDIENCE:subtrack-client}
subtrack.jwt.secret=${JWT_SECRET:}
