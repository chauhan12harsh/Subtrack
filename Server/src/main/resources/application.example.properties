spring.application.name=subtrack-server
server.port=8080

spring.datasource.url=<session-pooler-connection-url>
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT values are supplied through environment variables; never commit secrets.
subtrack.jwt.issuer=subtrack
subtrack.jwt.secret=<signing-key>
# Token lifetime in seconds (900 = 15 minutes).
subtrack.jwt.expiration=900
